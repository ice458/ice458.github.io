<!-- Consent Mode default (runs before GTM) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  // Force host-only cookies to avoid public suffix issues (e.g., github.io)
  gtag('set','cookie_domain','none');
  gtag('consent', 'default', {
    ad_storage: 'denied',
    analytics_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 2000
  });
</script>
<!-- Consent geo override: auto-grant analytics outside EEA/UK -->
<script>
  (function(){
    try {
      var stored = null;
      try { stored = localStorage.getItem('consent.choice'); } catch(e) {}
      if (stored === 'denied') return;
      if (stored === 'granted') {
        gtag('consent','update',{
          ad_storage:'granted', analytics_storage:'granted',
          ad_user_data:'granted', ad_personalization:'granted'
        });
        return;
      }
      var tz = '';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
      var isEEA = /^Europe\//.test(tz)
               || tz === 'Asia/Nicosia'
               || /^Atlantic\/(Reykjavik|Madeira|Azores|Canary)$/.test(tz);
      if (!isEEA) {
        gtag('consent','update',{ analytics_storage:'granted' });
      }
    } catch(e) {}
  })();
</script>
